name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  syntax-check:
    name: Syntax & sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bash scripts
        run: |
          set -euo pipefail
          failed=0
          for f in run_simulation.sh scripts/*.sh slurm/*.sbatch slurm/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              echo "❌ bash syntax error in $f"
              failed=1
            else
              echo "✅ $f"
            fi
          done
          exit $failed

      - name: Validate machine profiles
        run: |
          set -euo pipefail
          failed=0
          for f in profiles/*.env; do
            [ -f "$f" ] || continue
            if ! (
              set -a; source "$f"
              : "${PROFILE_NAME:?missing}"
              : "${ENV_SETUP+x}"
              : "${MDRUN_GPU_FLAG+x}"
              : "${PROD_NS:?missing}"
              : "${PARTITION+x}" "${ACCOUNT+x}" "${GRES+x}"
              : "${TIME_01:?missing}" "${CPUS_01:?missing}" "${MEM_01:?missing}"
              : "${TIME_02:?missing}" "${CPUS_02:?missing}" "${MEM_02:?missing}"
              : "${TIME_03:?missing}" "${CPUS_03:?missing}" "${MEM_03:?missing}"
              : "${TIME_04:?missing}" "${CPUS_04:?missing}" "${MEM_04:?missing}"
              : "${SSH_HOST+x}" "${SSH_USER+x}" "${REMOTE_DIR+x}"
            ) 2>/dev/null; then
              echo "❌ profile $f missing required variables"
              failed=1
            else
              echo "✅ $f"
            fi
          done
          exit $failed

      - name: Validate Python scripts
        run: |
          set -euo pipefail
          failed=0
          for f in scripts/*.py research/scripts/*.py; do
            [ -f "$f" ] || continue
            if ! python3 -m py_compile "$f"; then
              echo "❌ python syntax error in $f"
              failed=1
            else
              echo "✅ $f"
            fi
          done
          exit $failed

      - name: Validate research run log (JSONL)
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, pathlib
          p = pathlib.Path("research/deepsearch.log")
          bad = 0
          for i, line in enumerate(p.read_text().splitlines(), 1):
              if not line or line.startswith("#"):
                  continue
              try:
                  rec = json.loads(line)
                  assert all(k in rec for k in ("ts", "query", "report", "sources_used", "tools")), "missing field"
              except Exception as e:
                  print(f"❌ line {i}: {e}")
                  bad = 1
          if bad:
              raise SystemExit(1)
          print(f"✅ research/deepsearch.log parses as JSONL")
          EOF

      - name: Validate environment.yml
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import sys
          try:
              import yaml
          except ImportError:
              print("⚠️  pyyaml not available — skipping YAML parse")
              sys.exit(0)
          with open("environment.yml") as f:
              data = yaml.safe_load(f)
          assert data["name"] == "na53_aptamer", "env name mismatch"
          deps = data["dependencies"]
          assert any(str(d).startswith("gromacs=") for d in deps), "gromacs pin missing"
          print("✅ environment.yml OK")
          EOF

      - name: Check no CHANGE_ME placeholders in committed sbatch files
        run: |
          set -euo pipefail
          # exclude the integrity checker: its header documents the C4 pattern it scans for
          if grep -rn "CHANGE_ME" slurm/ scripts/ --exclude=check_repo_integrity.sh 2>/dev/null; then
            echo "❌ Unresolved CHANGE_ME placeholder committed"
            exit 1
          fi
          echo "✅ No unresolved placeholders"

      # Postmortem guard (docs/INCIDENT_ANALYSIS.md): catches on every push the
      # classes that previously shipped broken: missing/gitignored runtime files
      # (K2 — .gitignore swallowed configs/em,nvt,npt,npt_free.mdp), non-executable
      # entry points (K1), MDP drift from the validated standard (P), placeholders.
      - name: Repo integrity (scripts/check_repo_integrity.sh)
        run: |
          set -euo pipefail
          bash scripts/check_repo_integrity.sh