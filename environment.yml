# VERIFIED Taiwania 3 (2026-09-03): NO cuda/cmake/openmpi/fftw modules, GPU
# partitions restricted (ngs*) or down (gpu-amd). Therefore the engine is the
# conda-forge CPU build of GROMACS — prebuilt (AVX2 + thread-MPI), zero compile
# risk, ~40-70 ns/day on a 56-core ct56 node. Do NOT mix a source-compiled gmx
# into this env (two binaries would shadow each other).
name: na53_aptamer
channels:
  # INCIDENT 2026-09-04: `defaults` was listed here and conda 25.x blocks it
  # behind an interactive ToS gate (CondaToSNonInteractiveError) on the login
  # node. Every package below exists on conda-forge, so the env is now pure
  # conda-forge — no ToS gate, no licensing surface.
  - conda-forge
dependencies:
  - python=3.10
  - gromacs=2024.4
  - ambertools=23
  # INCIDENT 2026-09-04 (2): `viennarna` was listed here but is NOT on
  # conda-forge (it is bioconda-only) -> conda env create failed with
  # PackagesNotFoundError on a pure conda-forge env. It was only a FALLBACK
  # for 2D prediction behind pip-installed seqfold (the primary), so it is
  # removed. If RNAfold is ever needed: conda install -c bioconda viennarna
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - pandas
  - biopython
  - mdanalysis
  - natsort
  - tqdm
  - pip:
    - seqfold
